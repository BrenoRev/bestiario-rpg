# Configuração do Supabase CLI para desenvolvimento local (`supabase start`).
project_id = "bestiario"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true
# Mesma política do projeto de produção: mínimo de 6 caracteres, com letras e números
# (o app valida o mesmo antes de enviar, em passwordProblem).
minimum_password_length = 6
password_requirements = "letters_digits"

[auth.email]
# Cadastro e login por e-mail e senha. Sem confirmação por e-mail: a conta já entra logada.
enabled = true
enable_confirmations = false
# Troca de e-mail e de senha protegidas, como em produção.
double_confirm_changes = true
secure_password_change = true

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.ai-creature]
verify_jwt = true

[functions.ai-image]
verify_jwt = true
