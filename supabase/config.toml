# Configuração do Supabase CLI para desenvolvimento local (`supabase start`).
project_id = "bestiario"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true
# Senhas com pelo menos 8 caracteres (o app valida o mesmo antes de enviar).
minimum_password_length = 8

[auth.email]
# Cadastro e login por e-mail e senha. Sem confirmação por e-mail: a conta já entra logada.
enabled = true
enable_confirmations = false
double_confirm_changes = true

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.ai-creature]
verify_jwt = true

[functions.ai-image]
verify_jwt = true
