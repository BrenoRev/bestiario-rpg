# Publica o backend no Supabase de produção sempre que a main muda.
# Só roda depois que o CI daquele mesmo commit da main passa (tipos, testes,
# migrações e segurança). Também pode ser disparado à mão em Actions → Run workflow.
#
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  (obrigatório) token pessoal: supabase.com → Account → Access Tokens
#   SUPABASE_DB_PASSWORD   (opcional)    senha do banco; sem ela o CLI usa um papel de login temporário
name: Deploy Supabase

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez, na ordem dos commits; nunca cancela um deploy em andamento.
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrações e Edge Functions
    # Só depois de um CI verde em push na main (PRs não publicam nada).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_PROJECT_ID: hybriqcwwmsxqyqsavxi
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Confere o segredo de acesso
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Defina o segredo SUPABASE_ACCESS_TOKEN no repositório (gh secret set SUPABASE_ACCESS_TOKEN)."
            exit 1
          fi

      # Publica exatamente o commit que passou no CI.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Aplica as migrações pendentes
        run: |
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase db push --remote="$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --yes
          else
            supabase db push --remote="$SUPABASE_PROJECT_ID" --yes
          fi

      - name: Publica as Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Resumo
        run: |
          {
            echo "### Supabase atualizado"
            echo "- Commit: \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
            echo "- Projeto: \`$SUPABASE_PROJECT_ID\`"
            echo "- Migrações aplicadas e Edge Functions publicadas."
          } >> "$GITHUB_STEP_SUMMARY"
